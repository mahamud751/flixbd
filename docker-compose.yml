services:
  postgres:
    image: postgres:17-alpine
    container_name: flixbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flixbd
      POSTGRES_PASSWORD: flixbd
      POSTGRES_DB: flixbd
    ports:
      - "15432:5432"
    volumes:
      - flixbd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flixbd -d flixbd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flixbd_pgdata:
